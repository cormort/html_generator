<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>HTML Editor Ultimate (桌面完整版)</title>
    
    <!-- 1. 引入必要的函式庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/material-palenight.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/eclipse.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/dialog/dialog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS 變數與主題系統 --- */
        :root {
            --header-height: 50px;
            --bg-color: #21222c;
            --pane-bg: #282a36;
            --text-color: #f8f8f2;
            --border-color: #44475a;
            --accent-color: #bd93f9; /* Dracula Purple */
            --header-bg: #191a21;
            --highlight-line: rgba(189, 147, 249, 0.25);
        }

        /* Light Theme 變數覆蓋 */
        [data-theme="eclipse"] {
            --bg-color: #e0e0e0;
            --pane-bg: #ffffff;
            --text-color: #333;
            --border-color: #ccc;
            --accent-color: #0366d6;
            --header-bg: #f5f5f5;
            --highlight-line: rgba(255, 255, 0, 0.3);
        }

        /* --- 全局佈局 (Desktop Only) --- */
        * { box-sizing: border-box; outline: none; }
        
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; /* 鎖定外層，防止雙重捲軸 */
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .app-layout {
            display: flex; flex-direction: column; height: 100vh;
        }

        /* --- Header --- */
        .navbar {
            flex: 0 0 var(--header-height);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
            user-select: none;
        }
        .navbar-title { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; color: var(--accent-color); }
        
        .navbar-controls { display: flex; gap: 10px; align-items: center; }
        
        .btn-icon {
            background: transparent; border: 1px solid transparent; color: var(--text-color); 
            cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: 0.2s;
            font-size: 0.9rem; opacity: 0.8;
        }
        .btn-icon:hover { opacity: 1; background: rgba(128,128,128,0.2); }
        .btn-primary { color: var(--accent-color); font-weight: bold; border: 1px solid var(--border-color); }

        select.theme-select {
            background: var(--pane-bg); color: var(--text-color);
            border: 1px solid var(--border-color); padding: 4px; border-radius: 4px;
        }

        /* --- Workspace Grid (左 | 拉桿 | 中 | 拉桿 | 右) --- */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 240px 4px 1fr 4px 1fr; 
            overflow: hidden;
            position: relative;
        }

        /* --- Panes --- */
        .pane {
            background: var(--pane-bg);
            display: flex; flex-direction: column;
            min-width: 0; height: 100%;
            position: relative;
        }

        .pane-header {
            flex: 0 0 32px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px;
            font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px;
            color: var(--text-color); opacity: 0.8;
        }

        /* 內容捲動區 (左側與中間) */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* 自定義捲軸 */
        .scroll-area::-webkit-scrollbar { width: 8px; height: 8px; }
        .scroll-area::-webkit-scrollbar-track { background: transparent; }
        .scroll-area::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }

        /* --- 左側結構樹 --- */
        .outline-item {
            padding: 5px 10px; cursor: pointer; border-left: 3px solid transparent;
            font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid rgba(128,128,128,0.1);
            display: flex; align-items: center;
        }
        .outline-item:hover { background: rgba(128,128,128,0.1); border-left-color: var(--accent-color); }
        .tag-badge { 
            display: inline-block; padding: 2px 6px; border-radius: 3px; 
            background: rgba(128,128,128,0.2); font-family: monospace; font-size: 0.75rem; margin-right: 8px;
            color: var(--accent-color);
        }
        .id-text { color: #61afef; margin-left: 5px; font-size: 0.8rem; }

        /* --- 中間 CodeMirror --- */
        .CodeMirror {
            height: 100% !important;
            font-family: 'Fira Code', Consolas, monospace;
            font-size: 14px; line-height: 1.6;
        }
        .highlight-line { background-color: var(--highlight-line) !important; }

        /* --- 右側預覽 --- */
        .preview-wrapper {
            flex: 1; background: white; overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- Resizer --- */
        .resizer {
            background: var(--bg-color); cursor: col-resize; z-index: 10;
            transition: background 0.2s;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }
        .resizer:hover, .resizer.active { background: var(--accent-color); }

        /* --- Modals (AI) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;
            backdrop-filter: blur(2px);
        }
        .modal-box {
            background: var(--pane-bg); width: 600px; max-width: 90%; 
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; border: 1px solid var(--border-color);
        }
        .modal-header { padding: 15px; background: rgba(0,0,0,0.2); font-weight: bold; border-bottom: 1px solid var(--border-color); }
        .modal-body { padding: 15px; }
        .modal-footer { padding: 10px 15px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-color); }
        
        textarea.ai-input {
            width: 100%; height: 200px; background: rgba(0,0,0,0.1); 
            border: 1px solid var(--border-color); color: var(--text-color); 
            padding: 10px; font-family: monospace; resize: vertical;
        }

        /* --- Toast --- */
        .toast {
            position: fixed; bottom: 20px; right: 20px; 
            padding: 10px 20px; background: #28a745; color: white; 
            border-radius: 4px; transform: translateY(100px); 
            transition: transform 0.3s; z-index: 2000;
        }
        .toast.show { transform: translateY(0); }
    </style>
</head>

<body>

    <div class="app-layout">
        <!-- 頂部導航 -->
        <header class="navbar">
            <div class="navbar-title">
                <i class="fa-solid fa-code"></i> HTML Ultimate
            </div>
            <div class="navbar-controls">
                <span id="save-status" style="font-size: 0.8rem; opacity: 0.6; margin-right: 10px;"></span>
                
                <select class="theme-select" onchange="setTheme(this.value)">
                    <option value="dracula">Dracula (Dark)</option>
                    <option value="material">Material (Dark)</option>
                    <option value="eclipse">Eclipse (Light)</option>
                </select>

                <button class="btn-icon btn-primary" onclick="openAiModal()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 替換
                </button>
                <button class="btn-icon" onclick="formatCode()" title="美化代碼">
                    <i class="fa-solid fa-align-left"></i>
                </button>
                <button class="btn-icon" onclick="copyCode()" title="複製全部">
                    <i class="fa-regular fa-copy"></i>
                </button>
                <button class="btn-icon" onclick="clearEditor()" title="清空" style="color:#ff5555">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>
        </header>

        <!-- 主要工作區 (Grid) -->
        <div class="workspace" id="grid">

            <!-- 左側：結構樹 -->
            <div class="pane" id="pane-nav">
                <div class="pane-header">
                    <span><i class="fa-solid fa-layer-group"></i> DOM 結構</span>
                    <button class="btn-icon" onclick="updateOutline()" style="font-size:0.7rem">⟳</button>
                </div>
                <div id="outline-container" class="scroll-area"></div>
            </div>

            <!-- 拉桿 1 -->
            <div class="resizer" data-target="pane-nav"></div>

            <!-- 中間：編輯器 -->
            <div class="pane" id="pane-editor">
                <div class="pane-header">
                    <span><i class="fa-solid fa-file-code"></i> 原始碼</span>
                </div>
                <textarea id="code-editor"></textarea>
            </div>

            <!-- 拉桿 2 -->
            <div class="resizer" data-target="pane-editor"></div>

            <!-- 右側：預覽 -->
            <div class="pane" id="pane-preview">
                <div class="pane-header">
                    <span><i class="fa-solid fa-desktop"></i> 即時預覽 (點擊元素跳轉)</span>
                </div>
                <div class="preview-wrapper">
                    <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- AI 彈窗 -->
    <div id="ai-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <i class="fa-solid fa-robot"></i> AI 智能替換
            </div>
            <div class="modal-body">
                <p style="font-size:0.9rem; margin-top:0; opacity:0.8;">
                    請貼上 LLM (ChatGPT/Claude) 產生的新程式碼區塊。<br>
                    若有選取文字，將直接替換選取範圍；否則將插入游標處。
                </p>
                <textarea id="ai-input" class="ai-input" placeholder="例如：
function updateChart() {
    // 新的邏輯...
}"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-icon" onclick="closeAiModal()" style="border:1px solid var(--border-color)">取消</button>
                <button class="btn-icon btn-primary" onclick="performSmartReplace()">執行替換</button>
            </div>
        </div>
    </div>

    <!-- 提示訊息 -->
    <div id="toast" class="toast"><i class="fa-solid fa-check"></i> 已儲存</div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/xml-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>

    <script>
        // --- 1. 編輯器初始化 ---
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            mode: "htmlmixed",
            theme: "dracula",
            lineNumbers: true,
            lineWrapping: true,
            styleActiveLine: true,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"]
        });
        
        const previewFrame = document.getElementById('preview-frame');
        let debounceTimer;

        // 預設範本
        const defaultContent = `<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        p { color: #666; line-height: 1.6; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #output { margin-top: 15px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div id="main-card" class="card">
        <h1>Hello World</h1>
        <p>這是一個整合了 DOM 結構、代碼編輯與即時預覽的編輯器。</p>
        <p>試試看點擊右側預覽區的文字，左側代碼會自動跳轉！</p>
        
        <button id="btn-test" onclick="showMessage()">點擊測試</button>
        <div id="output"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById('output').innerText = "按鈕已點擊！時間：" + new Date().toLocaleTimeString();
        }
    <\/script>
</body>
</html>`;

        // --- 2. 核心：預覽與雙向同步 ---
        function updatePreview() {
            let content = editor.getValue();
            
            // 注入同步腳本 (Reverse Sync)
            const syncScript = `
            <script>
                document.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const data = {
                        type: 'sync-click',
                        tag: e.target.tagName.toLowerCase(),
                        id: e.target.id,
                        cls: e.target.className,
                        text: e.target.innerText ? e.target.innerText.substring(0, 15) : ''
                    };
                    window.parent.postMessage(data, '*');
                }, true);
            <\/script>`;
            
            if(content.includes('</body>')) {
                content = content.replace('</body>', syncScript + '</body>');
            } else {
                content += syncScript;
            }
            
            previewFrame.srcdoc = content;
            
            // 同步更新左側結構
            updateOutline();
            saveToLocal();
        }

        // 接收 iframe 點擊事件
        window.addEventListener('message', (e) => {
            if (e.data.type === 'sync-click') {
                const { tag, id, cls } = e.data;
                
                // 建立搜尋正則
                let regexStr = `<${tag}`;
                if (id) regexStr += `[^>]*id=["']${id}["']`;
                else if (cls && typeof cls === 'string' && cls.trim()) {
                    const firstClass = cls.split(' ')[0];
                    regexStr += `[^>]*class=["'][^"']*${firstClass}[^"']*["']`;
                }
                
                const cursor = editor.getSearchCursor(new RegExp(regexStr, 'i'));
                if (cursor.findNext()) {
                    const line = cursor.from().line;
                    jumpToLine(line);
                    showToast(`定位到 <${tag}>`);
                }
            }
        });

        // --- 3. 左側結構樹 (DOM Tree) ---
        function updateOutline() {
            const list = document.getElementById('outline-container');
            const lines = editor.getValue().split('\n');
            let html = '';
            
            lines.forEach((line, i) => {
                // 簡單解析：抓取 <tag id="x">
                const match = line.match(/<([a-zA-Z0-9-]+)([^>]*)>/);
                if (match) {
                    const tag = match[1];
                    const attrs = match[2];
                    
                    // 排除閉合標籤
                    if (line.includes(`</${tag}`) && !line.includes(`<${tag}`)) return;

                    const idMatch = attrs.match(/id=["']([^"']+)["']/);
                    const id = idMatch ? '#' + idMatch[1] : '';
                    
                    // 過濾顯示重要的標籤
                    const importantTags = ['html','head','body','div','section','article','header','footer','nav','h1','h2','h3','form','table','script','style'];
                    
                    if (importantTags.includes(tag) || id) {
                        html += `
                        <div class="outline-item" onclick="jumpToLine(${i})">
                            <span class="tag-badge">${tag}</span>
                            ${id ? `<span class="id-text">${id}</span>` : ''}
                        </div>`;
                    }
                }
            });
            
            list.innerHTML = html || '<div style="padding:10px; opacity:0.5; text-align:center">無結構</div>';
        }

        function jumpToLine(line) {
            editor.setCursor(line, 0);
            // 垂直置中
            const coords = editor.charCoords({line: line, ch: 0}, "local");
            const scrollInfo = editor.getScrollInfo();
            editor.scrollTo(null, coords.top - scrollInfo.clientHeight / 2);
            editor.focus();
            
            // 高亮閃爍
            const mark = editor.markText({line, ch:0}, {line:line+1, ch:0}, {className: "highlight-line"});
            setTimeout(() => mark.clear(), 1500);
        }

        // --- 4. AI 替換功能 ---
        function openAiModal() { document.getElementById('ai-modal').style.display = 'flex'; }
        function closeAiModal() { document.getElementById('ai-modal').style.display = 'none'; }
        
        function performSmartReplace() {
            const input = document.getElementById('ai-input').value;
            if (!input) return;

            if (editor.somethingSelected()) {
                editor.replaceSelection(input);
            } else {
                editor.replaceRange(input + '\n', editor.getCursor());
            }
            
            closeAiModal();
            formatCode();
            showToast('代碼已插入');
            document.getElementById('ai-input').value = '';
        }

        // --- 5. 拖曳調整 (Resizer) ---
        document.querySelectorAll('.resizer').forEach(el => {
            el.addEventListener('mousedown', initResize);
        });

        function initResize(e) {
            e.preventDefault();
            const targetId = e.target.dataset.target;
            const grid = document.getElementById('grid');
            const previewWrapper = document.querySelector('.preview-wrapper');
            
            // 暫時停用 iframe 互動，避免拖曳卡住
            previewWrapper.style.pointerEvents = 'none';
            document.body.style.cursor = 'col-resize';
            e.target.classList.add('active');

            function doDrag(ev) {
                const cols = getComputedStyle(grid).gridTemplateColumns.split(' ');
                // cols[0]=Left, cols[2]=Center, cols[4]=Right
                
                if (targetId === 'pane-nav') {
                    // 調整左側寬度
                    const newWidth = ev.clientX;
                    if (newWidth > 150 && newWidth < 500) {
                        grid.style.gridTemplateColumns = `${newWidth}px 4px 1fr 4px 1fr`;
                    }
                } else if (targetId === 'pane-editor') {
                    // 調整中間寬度
                    const leftWidth = document.getElementById('pane-nav').offsetWidth;
                    const centerWidth = ev.clientX - leftWidth - 4;
                    if (centerWidth > 200 && (ev.clientX < window.innerWidth - 200)) {
                        grid.style.gridTemplateColumns = `${leftWidth}px 4px ${centerWidth}px 4px 1fr`;
                    }
                }
            }

            function stopDrag() {
                document.removeEventListener('mousemove', doDrag);
                document.removeEventListener('mouseup', stopDrag);
                document.body.style.cursor = '';
                e.target.classList.remove('active');
                previewWrapper.style.pointerEvents = 'auto';
                editor.refresh();
            }

            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        // --- 6. 輔助功能 ---
        function formatCode() {
            editor.setValue(html_beautify(editor.getValue(), { indent_size: 4, indent_inner_html: true }));
        }

        function copyCode() {
            navigator.clipboard.writeText(editor.getValue()).then(() => showToast('已複製全部代碼'));
        }

        function clearEditor() {
            if(confirm('確定要清空所有代碼嗎？')) editor.setValue('');
        }

        function setTheme(theme) {
            editor.setOption('theme', theme);
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('editor_theme', theme);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid fa-check"></i> ${msg}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function saveToLocal() {
            localStorage.setItem('ultimate_editor_content', editor.getValue());
            const t = new Date();
            document.getElementById('save-status').innerText = `已儲存 ${t.getHours()}:${t.getMinutes().toString().padStart(2, '0')}`;
        }

        // --- 7. 啟動載入 ---
        window.addEventListener('load', () => {
            // 恢復主題
            const savedTheme = localStorage.getItem('editor_theme') || 'dracula';
            document.querySelector(`.theme-select [value="${savedTheme}"]`).selected = true;
            setTheme(savedTheme);

            // 恢復內容
            const savedContent = localStorage.getItem('ultimate_editor_content');
            if (savedContent) editor.setValue(savedContent);
            else editor.setValue(defaultContent);

            // 監聽變更
            editor.on('change', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(updatePreview, 500);
            });

            updatePreview();
        });

    </script>
</body>
</html>
